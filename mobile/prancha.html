<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pranchas — Ikatu</title>
  <meta name="theme-color" content="#1a2a3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ikatu">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="mobile.css?v=202609081838">
  <style>
    /* ── Bloco de filtros sticky (busca + marca + projetista) ──────
       Agrupados num único wrapper sticky para rolar/grudar juntos */
    .prancha-filters-sticky {
      position: sticky;
      top: var(--header-total-h);
      z-index: 100;
      background: var(--bg);
      padding-bottom: 4px;
    }
    .prancha-search-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Lista de linhas ────────────────────────── */
    .prancha-lista {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0 14px;
    }

    .prancha-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 11px 12px;
      margin-top: 10px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .prancha-row:active { box-shadow: 0 1px 4px rgba(0,0,0,.06); }

    /* Thumbnail */
    .prancha-row-thumb {
      width: 72px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: #e8eef4;
      display: block;
    }
    .prancha-row-thumb-empty {
      width: 72px;
      height: 52px;
      background: linear-gradient(135deg, #e8eef4 0%, #dde6f0 100%);
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prancha-row-thumb-empty svg { opacity: 0.35; }

    /* Info */
    .prancha-row-info { flex: 1; min-width: 0; }

    .prancha-row-os {
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--blue);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prancha-row-modelo {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .prancha-row-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }
    .prancha-row-tag {
      font-size: 10px;
      color: var(--muted);
      background: var(--gray);
      border-radius: 20px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .prancha-row-tag.projetista {
      color: var(--blue);
      background: #edf7fd;
    }

    /* Chevron */
    .prancha-row-chevron {
      color: var(--border);
      flex-shrink: 0;
    }

    /* ── Brand colors ───────────────────────────── */
    .prancha-row-igui      { border-left: 3px solid #00AEEF; background: #f0f8ff; }
    .prancha-row-splash    { border-left: 3px solid #e91e8c; background: #fff0f7; }
    .prancha-row-sobmedida { border-left: 3px solid #1A1A1A; background: #f2f2f2; }
    .prancha-row-igui:active      { background: #e4f3fc; }
    .prancha-row-splash:active    { background: #fce4f2; }
    .prancha-row-sobmedida:active { background: #e0e0e0; }

    .prancha-brand-bar {
      display: flex;
      gap: 8px;
      padding: 8px 14px 4px;
      background: var(--bg);
    }
    .prancha-brand-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--brand-color, #ccc);
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-color, #888);
      background: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .prancha-brand-pill.active {
      background: var(--brand-color, #888);
      color: #fff;
    }
    .pb-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--brand-color, #888);
      flex-shrink: 0;
    }
    .prancha-brand-pill.active .pb-dot { background: #fff; }
    .prancha-row-tag.brand-igui      { color: #0090cc; background: #e4f3fc; }
    .prancha-row-tag.brand-splash    { color: #c0186f; background: #fce4f2; }
    .prancha-row-tag.brand-sobmedida { color: #1A1A1A; background: #e0e0e0; }

    /* ── Filtro por projetista (igual ao desktop) ── */
    .prancha-user-bar {
      display: flex;
      gap: 6px;
      padding: 0 14px 8px;
      background: var(--bg);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .prancha-user-bar::-webkit-scrollbar { display: none; }
    .prancha-user-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .prancha-user-pill.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--dark);
    }
    .prancha-user-pill .pf-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: .7;
      flex-shrink: 0;
    }

    /* ── Paginação ───────────────────────────────── */
    .prancha-paginacao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 14px 4px;
    }
    .prancha-pag-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
    }
    .prancha-pag-btn:disabled { opacity: 0.35; cursor: default; }
    .prancha-pag-btn:not(:disabled):active { background: var(--gray); }
    .prancha-pag-info {
      font-family: 'Inter Tight', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      min-width: 56px;
      text-align: center;
    }

    /* ── Modal viewer — Bottom Sheet / Dialog ────── */
    .prancha-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(5, 13, 22, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .prancha-modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .prancha-modal-sheet {
      background: #111d29;
      width: 100%;
      max-height: 90vh;
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    .prancha-modal-overlay.open .prancha-modal-sheet {
      transform: translateY(0);
    }

    @media (min-width: 520px) {
      .prancha-modal-overlay {
        align-items: center;
        padding: 20px;
      }
      .prancha-modal-sheet {
        max-width: 480px;
        max-height: 86vh;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        transform: translateY(24px) scale(0.96);
      }
      .prancha-modal-overlay.open .prancha-modal-sheet {
        transform: translateY(0) scale(1);
      }
    }

    /* Puxador da gaveta */
    .prancha-sheet-handle-wrap {
      display: flex;
      justify-content: center;
      padding: 10px 0 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .prancha-sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.22);
    }

    /* Cabeçalho do modal */
    .prancha-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 14px;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .prancha-sheet-title-col {
      flex: 1;
      min-width: 0;
    }
    .prancha-sheet-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prancha-sheet-os {
      font-family: 'Inter Tight', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.2px;
    }
    .prancha-sheet-brand-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(0, 174, 239, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(0, 174, 239, 0.35);
    }
    .prancha-sheet-brand-badge.brand-splash {
      background: rgba(233, 30, 140, 0.15);
      color: #f472b6;
      border-color: rgba(233, 30, 140, 0.35);
    }
    .prancha-sheet-brand-badge.brand-sobmedida {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .prancha-sheet-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prancha-sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .prancha-sheet-close:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.93);
    }

    /* Conteúdo com rolagem */
    .prancha-sheet-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Imagem Hero */
    .prancha-sheet-img-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #09121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: zoom-in;
    }
    .prancha-sheet-img {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      display: block;
    }
    .prancha-sheet-img-empty {
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
    }
    .prancha-img-zoom-hint {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #fff;
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    /* ── Lightbox Zoom Tela Cheia ─────────────────── */
    .prancha-lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.96);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      touch-action: none;
    }
    .prancha-lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .prancha-lightbox-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(12px + var(--sat)) 16px 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 10;
    }
    .pl-tip {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 4px 10px;
    }
    .pl-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pl-close-btn:active { background: rgba(255, 255, 255, 0.3); }

    .prancha-lightbox-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    .prancha-lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.15s ease-out;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Seção de Informações / Detalhes */
    .prancha-sheet-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prancha-sheet-section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #64748b;
      text-transform: uppercase;
    }
    .prancha-info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .prancha-info-cell {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .pic-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pic-icon {
      font-size: 11px;
      line-height: 1;
    }
    .pic-val {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Card de aviso desktop */
    .prancha-desktop-notice-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 174, 239, 0.08);
      border: 1px dashed rgba(0, 174, 239, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 2px;
    }
    .pdn-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(0, 174, 239, 0.15);
      color: #00aeef;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pdn-text {
      flex: 1;
      min-width: 0;
    }
    .pdn-title {
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1.3;
    }
    .pdn-desc {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.3;
    }

    /* ── Skeleton ────────────────────────────────── */
    .prancha-skel-lista { padding: 0 14px; }
    .prancha-skel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 11px 12px;
      margin-top: 10px;
      box-shadow: var(--shadow);
    }
    .prancha-skel-thumb { width: 72px; height: 52px; border-radius: 6px; flex-shrink: 0; }
    .prancha-skel-info { flex: 1; }
    .prancha-skel-line { height: 10px; border-radius: 5px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="m-header">
    <img src="../logo_site.png" alt="Ikatu" class="m-header-logo">
    
    <div class="m-header-right">
      <a class="m-header-user-btn" id="mHeaderUser" href="perfil.html" title="Meu Perfil"></a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <div class="m-content">

    <!-- Bloco de filtros (busca + marca + projetista) — sticky dentro de m-content -->
    <div class="prancha-filters-sticky">
      <!-- Busca -->
      <div class="prancha-search-bar">
        <div class="m-search" style="margin-bottom:0;">
          <svg class="m-search-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="4"/><path d="M11 11l3 3"/></svg>
          <input type="search" id="campoBusca" placeholder="OS, modelo, loja, projetista…" oninput="buscar(this.value)">
        </div>
      </div>

      <!-- Filtros de marca -->
      <div class="prancha-brand-bar" id="brandBar"></div>

      <!-- Filtro por projetista (só aparece se houver mais de 1) -->
      <div class="prancha-user-bar" id="userBar" style="display:none"></div>
    </div>

    <!-- Lista de Pranchas -->
    <div id="pranchaLista"></div>
  </div>

  <!-- Modal viewer — Bottom Sheet Moderno -->
  <div class="prancha-modal-overlay" id="viewerModal">
    <div class="prancha-modal-sheet" onclick="event.stopPropagation()">
      <!-- Handle bar -->
      <div class="prancha-sheet-handle-wrap" onclick="fecharViewer()">
        <div class="prancha-sheet-handle"></div>
      </div>

      <!-- Header -->
      <div class="prancha-sheet-header">
        <div class="prancha-sheet-title-col">
          <div class="prancha-sheet-title-row">
            <span class="prancha-sheet-os" id="viewerTitle"></span>
            <span class="prancha-sheet-brand-badge" id="viewerBrandBadge">iGUI</span>
          </div>
          <div class="prancha-sheet-sub" id="viewerSub"></div>
        </div>
        <button class="prancha-sheet-close" onclick="fecharViewer()" aria-label="Fechar" title="Fechar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Scrollable content -->
      <div class="prancha-sheet-content">
        <!-- Hero Image -->
        <div class="prancha-sheet-img-wrap" id="viewerImgWrap" onclick="abrirLightbox()" title="Toque para ampliar em tela cheia">
          <img class="prancha-sheet-img" id="viewerImg" src="" alt="Prancha">
          <div class="prancha-img-zoom-hint">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            <span>Toque para ampliar</span>
          </div>
          <div class="prancha-sheet-img-empty" id="viewerImgEmpty" style="display:none">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/>
            </svg>
            <span>Sem pré-visualização disponível</span>
          </div>
        </div>

        <!-- Informações do Projeto -->
        <div class="prancha-sheet-section">
          <div class="prancha-sheet-section-title">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
            <span>DETALHES DO PROJETO</span>
          </div>
          <div class="prancha-info-grid" id="viewerDetailsGrid"></div>
        </div>

        <!-- Aviso Desktop -->
        <div class="prancha-desktop-notice-card">
          <div class="pdn-icon-box">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <div class="pdn-text">
            <div class="pdn-title">Para editar, acesse a versão desktop</div>
            <div class="pdn-desc">Modificações no projeto e prancha estão disponíveis no computador</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Zoom Tela Cheia -->
  <div class="prancha-lightbox" id="pranchaLightbox" onclick="fecharLightbox()">
    <div class="prancha-lightbox-topbar" onclick="event.stopPropagation()">
      <span class="pl-tip">Toque 2x para aproximar</span>
      <button class="pl-close-btn" onclick="fecharLightbox()" aria-label="Fechar zoom">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="prancha-lightbox-viewport" id="lightboxViewport" onclick="event.stopPropagation()">
      <img class="prancha-lightbox-img" id="lightboxImg" src="" alt="Prancha Ampliada">
    </div>
  </div>

  <!-- Toast -->
  <div class="m-toast" id="mToastGlobal"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../supabase-client.js?v=202609081838"></script>
  <script src="mobile-nav.js?v=202609081838"></script>
  <script>
  // ══════════════════════════════════════════════
  // Pranchas Mobile — layout em linhas + cache 5min
  // ══════════════════════════════════════════════

  const CACHE_KEY = 'igui_pranchas_cache_v2';
  const CACHE_TTL = 5 * 60 * 1000; // 5 minutos

  let todasPranchas = [];
  let buscaAtual    = '';
  let filtroBrand   = '';   // '' | 'iGUI' | 'Splash'
  let filtroUser    = '';   // '' = todos | nome do projetista (created_by)
  let paginaAtual   = 1;
  const POR_PAGINA  = 8;

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatarData(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' });
    } catch(_) { return ''; }
  }

  // ── Cache ────────────────────────────────────
  function salvarCache(dados) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), dados }));
    } catch(_) {}
  }

  function lerCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const { ts, dados } = JSON.parse(raw);
      if (Date.now() - ts > CACHE_TTL) return null; // expirado
      return dados;
    } catch(_) { return null; }
  }

  function invalidarCache() {
    try { localStorage.removeItem(CACHE_KEY); } catch(_) {}
  }

  // ── Pull-to-refresh ──────────────────────────
  window.ptrRecarregar = () => {
    invalidarCache();
    carregarPranchas();
  };

  // ── Filtro ──────────────────────────────────
  function filtrar(lista) {
    let r = lista;
    if (filtroBrand) r = r.filter(p => (p.brand || 'iGUI') === filtroBrand);
    if (filtroUser)  r = r.filter(p => (p.created_by || '') === filtroUser);
    if (buscaAtual) {
      const q = buscaAtual.toLowerCase();
      r = r.filter(p =>
        (p.project_code  || '').toLowerCase().includes(q) ||
        (p.model         || '').toLowerCase().includes(q) ||
        (p.store         || '').toLowerCase().includes(q) ||
        (p.client_name   || '').toLowerCase().includes(q) ||
        (p.created_by    || '').toLowerCase().includes(q)
      );
    }
    return r;
  }

  function buscar(valor) {
    buscaAtual = valor.trim().toLowerCase();
    paginaAtual = 1;
    renderLista(todasPranchas);
  }

  function renderBrandBar() {
    const bar = document.getElementById('brandBar');
    if (!bar) return;
    const brands = [
      { value: 'iGUI',            label: 'iGUi',            color: '#00AEEF' },
      { value: 'Splash',          label: 'Splash',           color: '#e91e8c' },
      { value: 'iGUi SOB MEDIDA', label: 'iGUi SOB MEDIDA',  color: '#1A1A1A' },
    ];
    bar.innerHTML = '';
    brands.forEach(({ value, label, color }) => {
      const btn = document.createElement('button');
      btn.className = 'prancha-brand-pill' + (filtroBrand === value ? ' active' : '');
      btn.style.setProperty('--brand-color', color);
      btn.innerHTML = `<span class="pb-dot"></span>${label}`;
      btn.onclick = () => {
        filtroBrand = (filtroBrand === value) ? '' : value;
        paginaAtual = 1;
        renderBrandBar();
        renderLista(todasPranchas);
      };
      bar.appendChild(btn);
    });
  }

  // ── Filtro por projetista (igual ao desktop: pills "Todos" + 1 por usuário) ──
  function renderUserBar(lista) {
    const bar = document.getElementById('userBar');
    if (!bar) return;

    const usuarios = [...new Set(
      lista.map(p => p.created_by || '').filter(Boolean)
    )].sort((a, b) => a.localeCompare(b, 'pt-BR'));

    // Só mostra a barra se houver mais de 1 projetista (ex.: admin vendo todos)
    if (usuarios.length <= 1) { bar.style.display = 'none'; return; }

    bar.style.display = 'flex';
    bar.innerHTML = '';

    const todos = document.createElement('button');
    todos.className = 'prancha-user-pill' + (filtroUser === '' ? ' active' : '');
    todos.innerHTML = `<span class="pf-dot"></span>Todos`;
    todos.onclick = () => {
      filtroUser = '';
      paginaAtual = 1;
      renderUserBar(todasPranchas);
      renderLista(todasPranchas);
    };
    bar.appendChild(todos);

    usuarios.forEach(user => {
      const pill = document.createElement('button');
      pill.className = 'prancha-user-pill' + (filtroUser === user ? ' active' : '');
      pill.innerHTML = `<span class="pf-dot"></span>${esc(user)}`;
      pill.onclick = () => {
        filtroUser = (filtroUser === user) ? '' : user;
        paginaAtual = 1;
        renderUserBar(todasPranchas);
        renderLista(todasPranchas);
      };
      bar.appendChild(pill);
    });
  }

  // ── Skeleton ────────────────────────────────
  function mostrarSkeleton() {
    const el = document.getElementById('pranchaLista');
    el.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'prancha-skel-lista';
    for (let i = 0; i < 6; i++) {
      wrap.innerHTML += `
        <div class="prancha-skel-row">
          <div class="prancha-skel-thumb m-skel"></div>
          <div class="prancha-skel-info">
            <div class="prancha-skel-line m-skel" style="width:45%"></div>
            <div class="prancha-skel-line m-skel" style="width:70%"></div>
            <div class="prancha-skel-line m-skel" style="width:55%"></div>
          </div>
        </div>`;
    }
    el.appendChild(wrap);
  }

  // ── Render ──────────────────────────────────
  function renderLista(lista) {
    const el = document.getElementById('pranchaLista');
    el.innerHTML = '';

    const filtradas = filtrar(lista);
    if (!filtradas.length) {
      el.innerHTML = `<div class="m-empty" style="padding-top:40px">
        <div class="m-empty-icon">
          <svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="28" height="32" rx="3"/><path d="M12 14h16M12 20h16M12 26h10"/></svg>
        </div>
        <div class="m-empty-title">Nenhuma prancha encontrada</div>
        <div class="m-empty-sub">Tente ajustar a busca ou crie uma nova prancha no desktop</div>
      </div>`;
      return;
    }

    const total  = filtradas.length;
    const inicio = (paginaAtual - 1) * POR_PAGINA;
    const fim    = Math.min(inicio + POR_PAGINA, total);
    const pagina = filtradas.slice(inicio, fim);

    const listaEl = document.createElement('div');
    listaEl.className = 'prancha-lista';

    pagina.forEach((p, i) => {
      const globalIdx = inicio + i;

      const thumb = p.thumbnail_url
        ? `<img class="prancha-row-thumb" src="${esc(p.thumbnail_url)}" alt="" loading="lazy">`
        : `<div class="prancha-row-thumb-empty">
             <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
               <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/>
             </svg>
           </div>`;

      const brand      = p.brand || 'iGUI';
      const isSplash   = brand === 'Splash';
      const isSobMedida = brand === 'iGUi SOB MEDIDA';
      const brandClass = isSplash ? 'prancha-row-splash' : isSobMedida ? 'prancha-row-sobmedida' : 'prancha-row-igui';
      const brandTag   = isSplash ? 'brand-splash' : isSobMedida ? 'brand-sobmedida' : 'brand-igui';

      const tags = [];
      const dataFmt = formatarData(p.proj_date);
      if (dataFmt)      tags.push(`<span class="prancha-row-tag">${esc(dataFmt)}</span>`);
      if (p.created_by) tags.push(`<span class="prancha-row-tag projetista">${esc(p.created_by)}</span>`);
      if (p.store)      tags.push(`<span class="prancha-row-tag">${esc(p.store)}</span>`);
      tags.push(`<span class="prancha-row-tag ${brandTag}">${esc(brand)}</span>`);

      listaEl.innerHTML += `
        <div class="prancha-row ${brandClass}" onclick="abrirViewer(${globalIdx})">
          ${thumb}
          <div class="prancha-row-info">
            <div class="prancha-row-os">${esc(p.project_code || 'Sem OS')}</div>
            <div class="prancha-row-modelo">${esc(p.model || p.client_name || '—')}</div>
            <div class="prancha-row-tags">${tags.join('')}</div>
          </div>
          <div class="prancha-row-chevron">
            <svg viewBox="0 0 8 14" width="8" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
          </div>
        </div>`;
    });

    el.appendChild(listaEl);

    if (total > POR_PAGINA) {
      const totalPags = Math.ceil(total / POR_PAGINA);
      const pagEl = document.createElement('div');
      pagEl.className = 'prancha-paginacao';
      pagEl.innerHTML = `
        <button class="prancha-pag-btn" onclick="irPagina(${paginaAtual - 1})" ${paginaAtual === 1 ? 'disabled' : ''}>
          <svg viewBox="0 0 8 14" width="8" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1L1 7l6 6"/></svg>
        </button>
        <span class="prancha-pag-info">${paginaAtual} / ${totalPags}</span>
        <button class="prancha-pag-btn" onclick="irPagina(${paginaAtual + 1})" ${paginaAtual === totalPags ? 'disabled' : ''}>
          <svg viewBox="0 0 8 14" width="8" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
        </button>`;
      el.appendChild(pagEl);
    }
  }

  function irPagina(n) {
    const totalPags = Math.ceil(filtrar(todasPranchas).length / POR_PAGINA);
    if (n < 1 || n > totalPags) return;
    paginaAtual = n;
    renderLista(todasPranchas);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Viewer ───────────────────────────────────
  let pranchaSelecionada = null;

  function abrirViewer(globalIdx) {
    const lista = filtrar(todasPranchas);
    const p = lista[globalIdx];
    if (!p) return;
    pranchaSelecionada = p;

    // Título e subtítulo
    document.getElementById('viewerTitle').textContent = p.project_code || 'Sem OS';
    document.getElementById('viewerSub').textContent   =
      [p.model, p.store, p.client_name].filter(Boolean).join(' · ');

    // Badge de Marca
    const brand = p.brand || 'iGUI';
    const badgeEl = document.getElementById('viewerBrandBadge');
    if (badgeEl) {
      badgeEl.textContent = brand;
      const isSplash   = brand === 'Splash';
      const isSobMedida = brand === 'iGUi SOB MEDIDA';
      badgeEl.className = 'prancha-sheet-brand-badge ' + (
        isSplash ? 'brand-splash' : isSobMedida ? 'brand-sobmedida' : 'brand-igui'
      );
    }

    // Imagem do Projeto
    const imgEl = document.getElementById('viewerImg');
    const emptyEl = document.getElementById('viewerImgEmpty');
    if (p.thumbnail_url) {
      imgEl.src = p.thumbnail_url;
      imgEl.style.display = 'block';
      if (emptyEl) emptyEl.style.display = 'none';
    } else {
      imgEl.style.display = 'none';
      if (emptyEl) emptyEl.style.display = 'flex';
    }

    // Grid de Detalhes
    const gridEl = document.getElementById('viewerDetailsGrid');
    if (gridEl) {
      const campos = [];
      if (p.client_name) campos.push({ icon: '👤', label: 'CLIENTE', val: p.client_name });
      if (p.model)       campos.push({ icon: '🏊', label: 'MODELO', val: p.model });
      if (p.store)       campos.push({ icon: '🏪', label: 'LOJA', val: p.store });
      if (p.city)        campos.push({ icon: '📍', label: 'CIDADE', val: p.city });
      if (p.created_by)  campos.push({ icon: '✍️', label: 'AUTOR', val: p.created_by });
      const dt = formatarData(p.proj_date);
      if (dt)            campos.push({ icon: '📅', label: 'DATA', val: dt });

      gridEl.innerHTML = campos.map(c => `
        <div class="prancha-info-cell">
          <div class="pic-label"><span class="pic-icon">${c.icon}</span> ${c.label}</div>
          <div class="pic-val" title="${esc(c.val)}">${esc(c.val)}</div>
        </div>
      `).join('');
    }

    document.getElementById('viewerModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function fecharViewer() {
    document.getElementById('viewerModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('viewerModal').addEventListener('click', e => {
    if (e.target.id === 'viewerModal') fecharViewer();
  });

  // ── Lightbox Zoom ────────────────────────────
  let lbZoom = 1;
  let lbX = 0, lbY = 0;
  let lbLastTap = 0;
  let lbStartX = 0, lbStartY = 0;
  let lbDragging = false;

  function abrirLightbox() {
    if (!pranchaSelecionada || !pranchaSelecionada.thumbnail_url) return;
    const lb = document.getElementById('pranchaLightbox');
    const img = document.getElementById('lightboxImg');
    img.src = pranchaSelecionada.thumbnail_url;
    lbZoom = 1;
    lbX = 0;
    lbY = 0;
    img.style.transform = 'scale(1) translate(0px, 0px)';
    lb.classList.add('open');
  }

  function fecharLightbox() {
    const lb = document.getElementById('pranchaLightbox');
    if (lb) lb.classList.remove('open');
  }

  const vp = document.getElementById('lightboxViewport');
  if (vp) {
    vp.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        const now = Date.now();
        if (now - lbLastTap < 300) {
          // Double-tap zoom toggle
          if (lbZoom > 1) {
            lbZoom = 1;
            lbX = 0;
            lbY = 0;
          } else {
            lbZoom = 2.4;
          }
          document.getElementById('lightboxImg').style.transform = `scale(${lbZoom}) translate(${lbX}px, ${lbY}px)`;
          lbLastTap = 0;
          return;
        }
        lbLastTap = now;
        lbStartX = e.touches[0].clientX - lbX;
        lbStartY = e.touches[0].clientY - lbY;
        lbDragging = true;
      }
    }, { passive: true });

    vp.addEventListener('touchmove', e => {
      if (!lbDragging || lbZoom <= 1 || e.touches.length !== 1) return;
      lbX = e.touches[0].clientX - lbStartX;
      lbY = e.touches[0].clientY - lbStartY;
      document.getElementById('lightboxImg').style.transform = `scale(${lbZoom}) translate(${lbX / lbZoom}px, ${lbY / lbZoom}px)`;
    }, { passive: true });

    vp.addEventListener('touchend', () => { lbDragging = false; });
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const lb = document.getElementById('pranchaLightbox');
      if (lb && lb.classList.contains('open')) {
        fecharLightbox();
      } else {
        fecharViewer();
      }
    }
  });

  // ── Carregar ─────────────────────────────────
  async function carregarPranchas() {
    const cached = lerCache();
    if (cached) {
      todasPranchas = cached;
      renderUserBar(todasPranchas);
      renderLista(todasPranchas);
      return;
    }

    mostrarSkeleton();

    try {
      // Aguarda supabase-client.js carregar
      await new Promise(r => {
        if (typeof sbListarProjetos === 'function') return r();
        const t = setInterval(() => {
          if (typeof sbListarProjetos === 'function') { clearInterval(t); r(); }
        }, 100);
        setTimeout(() => { clearInterval(t); r(); }, 8000);
      });

      if (typeof sbListarProjetos !== 'function') throw new Error('sbListarProjetos indisponível');

      const dados = await sbListarProjetos();
      todasPranchas = dados;
      salvarCache(dados);
      renderUserBar(todasPranchas);
      renderLista(todasPranchas);
    } catch (e) {
      console.error('Erro ao carregar pranchas:', e);
      document.getElementById('pranchaLista').innerHTML = `
        <div class="m-empty" style="padding-top:40px">
          <div class="m-empty-icon">⚠️</div>
          <div class="m-empty-title">Erro ao carregar</div>
          <div class="m-empty-sub">Verifique sua conexão e tente novamente</div>
          <button class="m-btn m-btn-secondary" style="margin-top:16px" onclick="invalidarCache();carregarPranchas()">Tentar novamente</button>
        </div>`;
    }
  }

  // ── Init ─────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => { renderBrandBar(); carregarPranchas(); });

  </script>
</body>
